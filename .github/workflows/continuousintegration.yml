name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint with flake8 (Qualidade de Código)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Calculator (Teste de Execução)
        run: |
          echo "1" | python calculadora.py || true